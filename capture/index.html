<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <style>
    :root {

      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --danger: #ef4444;
      --canvas-bg: #ffffff;
      --ink: #000000;
      --guide-line: #cbd5e1;
      --guide-base: #93c5fd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Amiri", "Traditional Arabic", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
    }
    .header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }
    .title { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
        .display-switch {
      display: flex;
      gap: 0.35rem;
      background: var(--card-bg);
      padding: 0.25rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .toggle-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.35rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: #3b82f6;
      color: #ffffff;
    }
    .mode-switch {
      display: flex;
      gap: 0.5rem;
      background: var(--card-bg);
      padding: 0.25rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.4rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: var(--primary);
      color: #0f172a;
    }
    .prompt-box {
      width: 100%;
      max-width: 960px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      text-align: center;
      position: relative;
    }
    .prompt-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .prompt-text {
      font-size: 2rem;
      line-height: 1.6;
      font-family: "Amiri", "Traditional Arabic", "Scheherazade", serif;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    .canvas-container {
      width: 100%;
      max-width: 960px;
      background: var(--canvas-bg);
      border-radius: 12px;
      border: 2px solid var(--border);
      position: relative;
      touch-action: none;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    canvas {
      width: 100%;
      height: 240px;
      display: block;
      cursor: crosshair;
    }
    .controls {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      gap: 0.75rem;
    }
    .btn-group { display: flex; gap: 0.5rem; }
    button {
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }
    .btn-secondary { background: var(--card-bg); color: var(--text); }
    .btn-secondary:hover { background: var(--border); }
    .btn-primary { background: var(--primary); color: #0f172a; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success { background: var(--accent); color: #0f172a; border-color: var(--accent); }
    .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }
    .stats-card {
      width: 100%;
      max-width: 960px;
      margin-top: 1.5rem;
      padding: 1rem;
      background: rgba(30, 41, 59, 0.5);
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-around;
      text-align: center;
    }
    .stat-val { font-size: 1.2rem; font-weight: 700; color: var(--text); margin-top: 0.2rem; }

</head>
<body>

  <div class="header">
    <div class="title">Hafiz HTR — Stopgap Ink Capture Studio</div>
    <div class="display-switch">
      <button class="toggle-btn active" id="toggleVowelledBtn" onclick="setDisplayMode('vowelled')">مشكول (Tanzil Simple)</button>
      <button class="toggle-btn" id="toggleRasmBtn" onclick="setDisplayMode('rasm')">رسم (Rasm-only)</button>
    </div>
    <div class="mode-switch">
      <button class="mode-btn active" id="modeLineBtn" onclick="setMode('line')">وضع السطر (Line: 3-9 كلمات)</button>
      <button class="mode-btn" id="modeWordBtn" onclick="setMode('word')">وضع الكلمة (Word: كلمة واحدة)</button>
    </div>
    <div style="display: flex; gap: 0.5rem; align-items: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem;">
      <label>Writer: <input id="writerIdInput" type="text" value="writer_01" style="background: var(--card-bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; width: 80px;" /></label>
      <label>Device: <input id="deviceInput" type="text" value="tablet" style="background: var(--card-bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; width: 80px;" /></label>
      <label>Stylus: <input id="stylusInput" type="text" value="active_pen" style="background: var(--card-bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; width: 80px;" /></label>
    </div>
  </div>

  <div class="prompt-box">
    <div class="prompt-info">
      <span id="promptIndex">العينة: 1 / 30</span>
      <span id="promptSurah">سورة الفاتحة</span>
    </div>
    <div class="prompt-text" id="promptText">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
  </div>

  <div class="canvas-container">
    <canvas id="inkCanvas"></canvas>
  </div>

  <div class="controls">
    <div class="btn-group">
      <button class="btn-danger" onclick="clearCanvas()">مسح (Clear)</button>
      <button class="btn-secondary" onclick="undoStroke()">تراجع (Undo)</button>
    </div>

    <div class="btn-group">
      <button class="btn-secondary" onclick="prevPrompt()">السابق (Prev)</button>
      <button class="btn-primary" onclick="saveAndNext()">حفظ والتالي (Save & Next)</button>
    </div>

    <div class="btn-group">
      <button class="btn-success" onclick="exportCapturedDataset()">تصدير البيانات (Export ZIP / Folder)</button>
    </div>
  </div>

  <div class="stats-card">
    <div>

      <div class="stat-val" id="savedCount">0</div>
    </div>
    <div>

    </div>
    <div>
      <div>دقة التصدير</div>
      <div class="stat-val">64px Height uint8</div>

        "id": "extra_word_rare_10",
        "rasm": "مجيب",
        "vowelled": "مُّجِيبٌ",
        "prompt_type": "vowelled",
        "surah": "سورة هود"
    }
];

    let promptDisplayMode = 'vowelled'; // 'vowelled' or 'rasm' (labels stay rasm-only)
    let currentMode = 'line';
    let currentIndex = 0;
    let savedSamples = [];

    const canvas = document.getElementById('inkCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let currentStroke = [];
    let strokes = []; // Array of strokes

    // 3 Ruled guide lines (tightened so median ink extent ~35px is ~0.73 of band height)
    // Band height = 165 - 117 = 48px -> median extent 35px / 48px = 73% (within 0.7 - 0.8)
    // 3 Ruled guide lines (Task 2.17: calibrated from 78.19px median extent to give 72.4% ratio)
    // Band height = 180 - 72 = 108 CSS px -> 78.19 / 108 = 72.4% (target 0.72 - 0.78), comfortable stylus spacing
    const GUIDE_TOP_Y = 72;      // Ascender line
    const GUIDE_BASE_Y = 147;    // Baseline (75px ascender room, 33px descender room)
    const GUIDE_BOT_Y = 180;     // Descender line

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = 240 * window.devicePixelRatio;
      redraw();
    }
    window.addEventListener('resize', resizeCanvas);

    function getPrompts() {
      return currentMode === 'line' ? PROMPTS_LINE : PROMPTS_WORD;
    }

    function setDisplayMode(mode) {
      promptDisplayMode = mode;
      document.getElementById('toggleVowelledBtn').classList.toggle('active', mode === 'vowelled');
      document.getElementById('toggleRasmBtn').classList.toggle('active', mode === 'rasm');
      updatePromptUI();
    }

    function updatePromptUI() {
      const prompts = getPrompts();
      const p = prompts[currentIndex];
      const displayText = (promptDisplayMode === 'vowelled') ? p.vowelled : p.rasm;
      document.getElementById('promptText').innerText = displayText;
      document.getElementById('promptSurah').innerText = p.surah;
      document.getElementById('promptIndex').innerText = `العينة: ${currentIndex + 1} / ${prompts.length}`;
      document.getElementById('savedCount').innerText = savedSamples.length;
    }

    function setMode(mode) {
      currentMode = mode;
      currentIndex = 0;
      document.getElementById('modeLineBtn').classList.toggle('active', mode === 'line');
      document.getElementById('modeWordBtn').classList.toggle('active', mode === 'word');
      clearCanvas();
      updatePromptUI();
    }

    function drawGuidelines() {
      const scale = window.devicePixelRatio;
      const w = canvas.width;

      ctx.save();
      ctx.lineWidth = 1 * scale;
      
      // Top guideline
      ctx.strokeStyle = '#e2e8f0';
      ctx.setLineDash([6 * scale, 6 * scale]);
      ctx.beginPath();
      ctx.moveTo(0, GUIDE_TOP_Y * scale);
      ctx.lineTo(w, GUIDE_TOP_Y * scale);
      ctx.stroke();

      // Baseline (solid, blue tint)
      ctx.strokeStyle = '#93c5fd';
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(0, GUIDE_BASE_Y * scale);
      ctx.lineTo(w, GUIDE_BASE_Y * scale);
      ctx.stroke();

      // Bottom guideline
      ctx.strokeStyle = '#e2e8f0';
      ctx.setLineDash([4 * scale, 4 * scale]);
      ctx.beginPath();
      ctx.moveTo(0, GUIDE_BOT_Y * scale);
      ctx.lineTo(w, GUIDE_BOT_Y * scale);
      ctx.stroke();

      ctx.restore();
    }

    function redraw() {
      const scale = window.devicePixelRatio;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawGuidelines();

      ctx.strokeStyle = '#000000';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (const stroke of strokes) {
        if (stroke.length < 2) continue;
        for (let i = 1; i < stroke.length; i++) {
          const p1 = stroke[i - 1];
          const p2 = stroke[i];
          const pressure = p2.p || 0.5;
          ctx.lineWidth = Math.max(1.5, pressure * 3.5) * scale;
          ctx.beginPath();
          ctx.moveTo(p1.x * scale, p1.y * scale);
          ctx.lineTo(p2.x * scale, p2.y * scale);
          ctx.stroke();
        }
      }
    }

    // Pointer Events
    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      currentStroke = [{ x, y, t: Date.now(), p: e.pressure || 0.5 }];
      strokes.push(currentStroke);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const p = { x, y, t: Date.now(), p: e.pressure || 0.5 };
      currentStroke.push(p);

      const scale = window.devicePixelRatio;
      const prev = currentStroke[currentStroke.length - 2];
      ctx.strokeStyle = '#000000';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(1.5, p.p * 3.5) * scale;
      ctx.beginPath();
      ctx.moveTo(prev.x * scale, prev.y * scale);
      ctx.lineTo(p.x * scale, p.y * scale);
      ctx.stroke();
    });

    function endStroke(e) {
      if (isDrawing) {
        isDrawing = false;
        redraw();
      }
    }
    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);

    function clearCanvas() {
      strokes = [];
      redraw();
    }

    function undoStroke() {
      strokes.pop();
      redraw();
    }

    function prevPrompt() {
      if (currentIndex > 0) {
        currentIndex--;
        clearCanvas();
        updatePromptUI();
      }
    }

    function exportRuledBandPNG() {
      // Find ink bounds horizontally
      let minX = Infinity, maxX = -Infinity;
      for (const stroke of strokes) {
        for (const pt of stroke) {
          if (pt.x < minX) minX = pt.x;
          if (pt.x > maxX) maxX = pt.x;
        }
      }
      if (minX === Infinity) return null; // No ink

      const scale = window.devicePixelRatio;
      const padX = 16;
      const cropX1 = Math.max(0, (minX - padX) * scale);
      const cropX2 = Math.min(canvas.width, (maxX + padX) * scale);
      const cropW = Math.max(cropX2 - cropX1, 32);

      // Vertical crop to ruled band (from top guideline to bottom guideline)
      const cropY1 = GUIDE_TOP_Y * scale;
      const cropY2 = GUIDE_BOT_Y * scale;
      const cropH = cropY2 - cropY1;

      // Extract raw ink on pure white canvas (without guidelines)
      const offscreen = document.createElement('canvas');
      offscreen.width = cropW;
      offscreen.height = cropH;
      const offCtx = offscreen.getContext('2d');
      offCtx.fillStyle = '#ffffff';
      offCtx.fillRect(0, 0, cropW, cropH);

      offCtx.strokeStyle = '#000000';
      offCtx.lineCap = 'round';
      offCtx.lineJoin = 'round';

      // Constant stroke width = 0.044 * band height in export pixels (2.8 px at 64)
      // No pressure dependence in export
      offCtx.lineWidth = 0.044 * cropH;

      for (const stroke of strokes) {
        if (stroke.length < 2) continue;
        for (let i = 1; i < stroke.length; i++) {
          const p1 = stroke[i - 1];
          const p2 = stroke[i];
          offCtx.beginPath();
          offCtx.moveTo(p1.x * scale - cropX1, p1.y * scale - cropY1);
          offCtx.lineTo(p2.x * scale - cropX1, p2.y * scale - cropY1);
          offCtx.stroke();
        }
      }

      // Resize to TARGET_HEIGHT = 64px using high quality smoothing
      const targetH = 64;
      const targetW = Math.max(32, Math.round(cropW * (targetH / cropH)));
      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = targetW;
      finalCanvas.height = targetH;
      const fCtx = finalCanvas.getContext('2d');
      fCtx.fillStyle = '#ffffff';
      fCtx.fillRect(0, 0, targetW, targetH);
      fCtx.imageSmoothingEnabled = true;
      fCtx.imageSmoothingQuality = 'high';
      fCtx.drawImage(offscreen, 0, 0, targetW, targetH);

      return finalCanvas.toDataURL('image/png');
    }

    function saveAndNext() {
      if (strokes.length === 0) {
        alert("يرجى كتابة النص أولاً قبل الحفظ!");
        return;
      }
      const dataUrl = exportRuledBandPNG();
      if (!dataUrl) return;

      const prompts = getPrompts();
      const p = prompts[currentIndex];
      const sampleId = `sample_${currentMode}_${String(currentIndex + 1).padStart(3, '0')}`;
      const writerId = document.getElementById('writerIdInput') ? document.getElementById('writerIdInput').value.trim() : 'writer_01';
      const deviceName = document.getElementById('deviceInput') ? document.getElementById('deviceInput').value.trim() : 'tablet';
      const stylusName = document.getElementById('stylusInput') ? document.getElementById('stylusInput').value.trim() : 'active_pen';

      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const bandTop = GUIDE_TOP_Y;
      const bandBase = GUIDE_BASE_Y;
      const bandBot = GUIDE_BOT_Y;
      const bandH = bandBot - bandTop;

      // Band-relative strokes: y relative to GUIDE_TOP_Y
      const bandRelativeStrokes = strokes.map(stroke => stroke.map(pt => ({
        x: pt.x,
        y: pt.y - bandTop,
        t: pt.t,
        p: pt.p || 0.5
      })));

      savedSamples.push({
        id: sampleId,
        mode: currentMode,
        text: p.rasm, // Manifest labels stay strictly rasm-only (simple-clean)
        prompt_display: (promptDisplayMode === 'vowelled') ? p.vowelled : p.rasm,
        prompt_type: promptDisplayMode,
        writer_id: writerId,
        device: deviceName,
        stylus: stylusName,
        surah: p.surah,
        capture_version: "v2",
        geometry: {
          capture_version: "v2",
          band_top_css: bandTop,
          band_base_css: bandBase,
          band_bot_css: bandBot,
          band_height_css: bandH,
          canvas_w_css: rect.width,
          canvas_h_css: rect.height,
          dpr: dpr
        },
        strokes: bandRelativeStrokes,
        strokes_canvas: JSON.parse(JSON.stringify(strokes)),
        dataUrl: dataUrl
      });

      clearCanvas();
      if (currentIndex < prompts.length - 1) {
        currentIndex++;
      }
      updatePromptUI();
    }

    // Pure JS Stored-ZIP (PKZIP Store method 0, uncompressed) writer with zero external dependencies
    function createStoredZip(files) {
      let crcTable = null;
      function makeCrcTable() {
        let c;
        const table = [];
        for (let n = 0; n < 256; n++) {
          c = n;
          for (let k = 0; k < 8; k++) {
            c = ((c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1));
          }
          table[n] = c >>> 0;
        }
        return table;
      }
      function crc32(buf) {
        if (!crcTable) crcTable = makeCrcTable();
        let crc = 0 ^ (-1);
        for (let i = 0; i < buf.length; i++) {
          crc = (crc >>> 8) ^ crcTable[(crc ^ buf[i]) & 0xFF];
        }
        return (crc ^ (-1)) >>> 0;
      }

      const fileRecords = [];
      let offset = 0;
      const parts = [];

      for (const f of files) {
        const nameBytes = new TextEncoder().encode(f.name);
        const dataBytes = f.data;
        const crc = crc32(dataBytes);
        const size = dataBytes.length;

        const header = new Uint8Array(30 + nameBytes.length);
        const view = new DataView(header.buffer);
        view.setUint32(0, 0x04034b50, true);
        view.setUint16(4, 10, true);
        view.setUint16(6, 0x0800, true); // UTF-8 filename flag
        view.setUint16(8, 0, true);      // compression method: 0 (stored)
        view.setUint16(10, 0, true);
        view.setUint16(12, 0, true);
        view.setUint32(14, crc, true);
        view.setUint32(18, size, true);
        view.setUint32(22, size, true);
        view.setUint16(26, nameBytes.length, true);
        view.setUint16(28, 0, true);
        header.set(nameBytes, 30);

        parts.push(header);
        parts.push(dataBytes);

        fileRecords.push({
          nameBytes,
          crc,
          size,
          offset
        });

        offset += header.length + dataBytes.length;
      }

      const cdOffset = offset;
      let cdSize = 0;

      for (const rec of fileRecords) {
        const cdHeader = new Uint8Array(46 + rec.nameBytes.length);
        const view = new DataView(cdHeader.buffer);
        view.setUint32(0, 0x02014b50, true);
        view.setUint16(4, 20, true);
        view.setUint16(6, 10, true);
        view.setUint16(8, 0x0800, true);
        view.setUint16(10, 0, true);
        view.setUint16(12, 0, true);
        view.setUint16(14, 0, true);
        view.setUint32(16, rec.crc, true);
        view.setUint32(20, rec.size, true);
        view.setUint32(24, rec.size, true);
        view.setUint16(28, rec.nameBytes.length, true);
        view.setUint16(30, 0, true);
        view.setUint16(32, 0, true);
        view.setUint16(34, 0, true);
        view.setUint16(36, 0, true);
        view.setUint32(38, 0, true);
        view.setUint32(42, rec.offset, true);
        cdHeader.set(rec.nameBytes, 46);

        parts.push(cdHeader);
        cdSize += cdHeader.length;
      }

      const eocd = new Uint8Array(22);
      const eocdView = new DataView(eocd.buffer);
      eocdView.setUint32(0, 0x06054b50, true);
      eocdView.setUint16(4, 0, true);
      eocdView.setUint16(6, 0, true);
      eocdView.setUint16(8, fileRecords.length, true);
      eocdView.setUint16(10, fileRecords.length, true);
      eocdView.setUint32(12, cdSize, true);
      eocdView.setUint32(16, cdOffset, true);
      eocdView.setUint16(20, 0, true);
      parts.push(eocd);

      return new Blob(parts, { type: "application/zip" });
    }

    function dataUrlToUint8Array(dataUrl) {
      const base64 = dataUrl.split(',')[1];
      const binary = atob(base64);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function exportCapturedDataset() {
      if (savedSamples.length === 0) {
        alert("لا توجد عينات محفوظة للتصدير بعد!");
        return;
      }

      const files = [];

      // 1. Generate Manifest CSV with all metadata fields including geometry
      let csv = "sample_id,image_file,mode,transcription,writer_id,device,stylus,prompt_type,capture_version,band_top_css,band_base_css,band_bot_css,canvas_w_css,canvas_h_css,dpr\n";
      for (const s of savedSamples) {
        const g = s.geometry || {};
        csv += `${s.id},${s.id}.png,${s.mode},"${s.text}",${s.writer_id},${s.device},${s.stylus},${s.prompt_type},${s.capture_version || 'v1'},${g.band_top_css || ''},${g.band_base_css || ''},${g.band_bot_css || ''},${g.canvas_w_css || ''},${g.canvas_h_css || ''},${g.dpr || ''}\n`;
      }
      files.push({
        name: "manifest.csv",
        data: new TextEncoder().encode(csv)
      });

      // 2. Generate strokes.json with geometry and band-relative strokes
      const strokesData = savedSamples.map(s => ({
        id: s.id,
        text: s.text,
        capture_version: s.capture_version || "v2",
        geometry: s.geometry || null,
        strokes: s.strokes
      }));
      files.push({
        name: "strokes.json",
        data: new TextEncoder().encode(JSON.stringify(strokesData, null, 2))
      });

      // 3. PNG images
      for (const s of savedSamples) {
        files.push({
          name: `${s.id}.png`,
          data: dataUrlToUint8Array(s.dataUrl)
        });
      }

      // 4. Download single stored ZIP file
      const zipBlob = createStoredZip(files);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(zipBlob);
      a.download = `hafiz_capture_${Date.now()}.zip`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      alert(`تم بنجاح تنزيل ملف ZIP موحد يحتوي على ${savedSamples.length} عينة + manifest.csv + strokes.json!`);
    }

    // Init
    resizeCanvas();
    updatePromptUI();
  </script>
</body>
