# configs/synth.yaml
# Synthetic Quranic line generation configuration (Task 2.4 Calibrated)

# Word-stream window settings
words_per_line:
  min: 3
  max: 9

# Image constraints
constraints:
  target_height: 64
  max_width_px: 1500
  width_multiple: 32

# Calibration bounds based on 2,000 KHATT train lines (p5 - p95)
calibration_bounds:
  stroke_width:
    min: 2.000
    max: 4.000
  ink_fraction:
    min: 0.043
    max: 0.110

# Font configuration
fonts:
  # Held-out fonts (evaluated on unseen fonts test split)
  held_out:
    - "Zain"
    - "Mirza"
  default_weight: 1.0
  # Calibrated per-font sampling weights based on KHATT train percentiles
  weights:
    Alkalami: 0.5
    Amiri: 1.0
    Aref_Ruqaa: 2.0
    Aref_Ruqaa_Ink: 2.0
    Badeen_Display: 0.0
    Baloo_Bhaijaan_2: 1.0
    Blaka: 0.0
    Blaka_Ink: 0.0
    Cairo_Play: 1.0
    El_Messiri: 1.0
    Gulzar: 1.0
    Harmattan: 1.0
    Jomhuria: 1.0
    Katibeh: 1.0
    Lalezar: 0.0
    Lateef: 1.0
    Lemonada: 0.5
    Marhey: 2.0
    Mirza: 0.0
    Playpen_Sans_Arabic: 2.0
    Qahiri: 1.0
    Rakkas: 1.0
    Reem_Kufi_Fun: 0.5
    Reem_Kufi_Ink: 0.5
    Ruwudu: 1.0
    Scheherazade_New: 1.0
    Vibes: 1.0
    Zain: 0.0

# Augmentation strengths (Augmentation v2 with relative thickness & p5-p95 rejection)
augmentation:
  baseline_wobble:
    enabled: true
    amp_min: 0.8
    amp_max: 2.5
    freq_min: 80.0
    freq_max: 160.0
  shear:
    enabled: true
    prob: 0.8
    max_shear: 0.15
  stroke_thickness:
    enabled: true
    relative_to_font: true
    max_delta_px: 1.0
    thicken_prob: 0.25
    thin_prob: 0.20
  elastic_warp:
    enabled: true
    prob: 0.6
    sigma: 0.8
  blur:
    enabled: true
    prob: 0.7
    radius_min: 0.2
    radius_max: 0.6
  noise:
    enabled: true
    prob: 1.0
    std_min: 2.0
    std_max: 5.0
  word_spacing_factor:
    min: 0.7
    max: 1.4
  font_size:
    min: 30
    max: 42
