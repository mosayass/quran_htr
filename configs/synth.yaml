# configs/synth.yaml
# Synthetic Quranic line generation configuration

# Word-stream window settings
words_per_line:
  min: 3
  max: 9

# Image constraints
constraints:
  target_height: 64
  max_width_px: 1500
  width_multiple: 32

# Font configuration
fonts:
  # Held-out fonts (evaluated separately or reserved)
  held_out:
    - "Playpen_Sans_Arabic"
    - "Gulzar"
    - "Vibes"
  default_weight: 1.0
  # Per-font sampling weights (unspecified fonts use default_weight)
  weights:
    Aref_Ruqaa: 1.5
    Aref_Ruqaa_Ink: 1.5
    Amiri: 1.2
    Lateef: 1.3
    Scheherazade_New: 1.2
    Qahiri: 1.0
    Rakkas: 1.0
    Katibeh: 1.1
    Zain: 1.1

# Augmentation strengths (Augmentation v1)
augmentation:
  baseline_wobble:
    enabled: true
    amp_min: 0.8
    amp_max: 2.5
    freq_min: 80.0
    freq_max: 160.0
  shear:
    enabled: true
    prob: 0.8
    max_shear: 0.15
  stroke_thickness:
    enabled: true
    thicken_prob: 0.25
    thin_prob: 0.20
  elastic_warp:
    enabled: true
    prob: 0.6
    sigma: 0.8
  blur:
    enabled: true
    prob: 0.7
    radius_min: 0.2
    radius_max: 0.6
  noise:
    enabled: true
    prob: 1.0
    std_min: 2.0
    std_max: 5.0
  word_spacing_factor:
    min: 0.7
    max: 1.4
  font_size:
    min: 30
    max: 42
